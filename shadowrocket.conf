# ============ 5. 中国 IP：直连 ============
# 域名没列到的国内网站，IP 在中国就直连，兜底用
GEOIP,CN,DIRECT

# ============ 6. 其他：默认走代理 ============
# 没命中的一律走代理，海外新站不会漏，国内漏网的站靠上面 GEOIP 兜底
FINAL,PROXY

[Host]
# 苹果和 iCloud 走系统 DNS，别被代理 DNS 拖慢
*.apple.com = server:system
*.icloud.com = server:system
localhost = 127.0.0.1

[URL Rewrite]
# Google 中国域名防跳转
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302
