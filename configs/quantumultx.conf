# Quantumult X 配置模板 · 远程规则集，更新方式：QX 里更新 filter_remote 即可
# Quantumult X Template: remote filters, update in QX to get the latest rules.
# 节点请用你自己的订阅，本文件只管规则。

[general]
server_check_url = http://www.gstatic.com/generate_204

[filter_remote]
https://raw.githubusercontent.com/danxinavi/shadowrocket-rules/main/ruleset/qx/reject.list, tag=Reject, force-policy=reject, enabled=true
https://raw.githubusercontent.com/danxinavi/shadowrocket-rules/main/ruleset/qx/direct.list, tag=Direct, force-policy=direct, enabled=true
https://raw.githubusercontent.com/danxinavi/shadowrocket-rules/main/ruleset/qx/proxy.list, tag=Proxy, force-policy=proxy, enabled=true

[filter_local]
# 本地兜底：局域网直连，中国 IP 直连，其他走代理
ip-cidr,192.168.0.0/16,direct
ip-cidr,10.0.0.0/8,direct
ip-cidr,172.16.0.0/12,direct
geoip,cn,direct
final,proxy
